<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<title>TCsMonitor · Offline</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .offline-page-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .offline-window-box { width: min(420px, 100%); }
  .offline-brand-title { font: 700 30px var(--font-title); color: var(--up); text-align: center; margin: 0 0 16px; }
  .offline-check-list { margin: 8px 0 14px; padding-left: 18px; color: var(--soft); }
  .offline-check-list li { margin: 4px 0; }
</style>
</head>
<body>
<div class="offline-page-wrap">
  <div>
    <h1 class="offline-brand-title">TCsMonitor<span class="app-status-cursor">_</span></h1>
    <section class="app-window offline-window-box">
      <header class="app-window-titlebar"><h2>Offline</h2></header>
      <div class="app-window-body">
        <p><span class="app-pill down">unreachable</span></p>
        <p>Can't reach your monitor right now. Check:</p>
        <ul class="offline-check-list">
          <li>Is the home PC on and awake?</li>
          <li>Is TCsMonitor running on it?</li>
          <li>Is Tailscale connected on this phone?</li>
        </ul>
        <button class="app-button" onclick="location.href='/'">Retry &gt;</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
